[workspace]
members = ["crates/core", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1